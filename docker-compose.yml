services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avyakt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avyakt_pass}
      POSTGRES_DB: ${POSTGRES_DB:-avyakt_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avyakt} -d ${POSTGRES_DB:-avyakt_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mern-backend:
    build:
      context: ./mern-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-avyakt}:${POSTGRES_PASSWORD:-avyakt_pass}@postgres:5432/${POSTGRES_DB:-avyakt_db}
      ALLOWED_ORIGINS: http://localhost,http://client
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - mern-backend

volumes:
  postgres_data:
